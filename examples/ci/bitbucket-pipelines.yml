# Publishes a repository's documentation together with the adocs service.
#
# Put this file at the repository root as bitbucket-pipelines.yml.
#
# Repository variables (Repository settings -> Repository variables):
#   DOCS_IMAGE       where to publish the image, for example docker.io/myorg/project-docs
#   DOCKER_USER      registry login
#   DOCKER_PASSWORD  registry password or token, mark it as Secured
# Optional, when the defaults below need overriding:
#   ADOCS_VERSION, ADOCS_IMAGE, ADOCS_RELEASE_URL, ADOCS_ASSET
#
# What you get:
#   - the image $DOCS_IMAGE with the documentation inside, tagged with the first 12 characters of the commit, latest and the git tag;
#   - the artifact docs-bundle.tar.gz for running without Docker: the adocs binary, the archive and .env.

image: atlassian/default-image:4

definitions:
  steps:
    - step: &archive
        name: Repository archive
        script:
          # Tracked files only, without .git. --prefix puts everything into a single directory, which the service strips.
          - git archive --format=tar.gz --prefix=repo/ -o repo.tar.gz HEAD
        artifacts:
          - repo.tar.gz

    - step: &image
        name: Image with the documentation
        services:
          - docker
        script:
          - |
            set -eu
            ADOCS_VERSION="${ADOCS_VERSION:-1.0.0}"
            ADOCS_IMAGE="${ADOCS_IMAGE:-docker.io/DOCKERHUB_USER/adocs}"
            SHORT=$(printf '%s' "$BITBUCKET_COMMIT" | cut -c1-12)

            # The build context holds only the archive and the Dockerfile, not the whole repository.
            mkdir -p image && mv repo.tar.gz image/
            cat > image/Dockerfile <<'EOF'
            ARG ADOCS_IMAGE
            ARG ADOCS_VERSION
            FROM ${ADOCS_IMAGE}:${ADOCS_VERSION}
            COPY repo.tar.gz /data/repo.tar.gz
            EOF

            printf '%s' "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin "${DOCS_IMAGE%%/*}"
            docker build \
              --build-arg ADOCS_IMAGE="$ADOCS_IMAGE" --build-arg ADOCS_VERSION="$ADOCS_VERSION" \
              --label "org.opencontainers.image.source=https://bitbucket.org/$BITBUCKET_REPO_FULL_NAME" \
              --label "org.opencontainers.image.revision=$BITBUCKET_COMMIT" \
              -t "$DOCS_IMAGE:$SHORT" -t "$DOCS_IMAGE:latest" image
            if [ -n "${BITBUCKET_TAG:-}" ]; then docker tag "$DOCS_IMAGE:$SHORT" "$DOCS_IMAGE:$BITBUCKET_TAG"; fi
            docker push --all-tags "$DOCS_IMAGE"

    - step: &bundle
        name: Bundle without Docker
        script:
          - |
            set -eu
            ADOCS_VERSION="${ADOCS_VERSION:-1.0.0}"
            ADOCS_RELEASE_URL="${ADOCS_RELEASE_URL:-https://github.com/GITHUB_OWNER/adocs/releases/download}"
            ADOCS_ASSET="${ADOCS_ASSET:-adocs-linux-x86_64}"
            BASE="$ADOCS_RELEASE_URL/v$ADOCS_VERSION"

            mkdir -p bundle/data && cp repo.tar.gz bundle/data/
            curl -fsSL -o bundle/adocs "$BASE/$ADOCS_ASSET"
            # If the release carries SHA256SUMS, the binary is checked against it, otherwise the step fails.
            if curl -fsSL -o SHA256SUMS "$BASE/SHA256SUMS"; then
              grep " $ADOCS_ASSET\$" SHA256SUMS | sed "s| $ADOCS_ASSET\$| adocs|" > bundle.sha256
              (cd bundle && sha256sum -c ../bundle.sha256)
            fi
            chmod +x bundle/adocs

            cat > bundle/.env <<'EOF'
            ADOCS_DATA_DIR=data
            ADOCS_ARCHIVE=repo.tar.gz
            ADOCS_CACHE_DIR=cache
            APP_HOST=0.0.0.0
            APP_PORT=8080
            EOF
            tar czf docs-bundle.tar.gz -C bundle .
        artifacts:
          - docs-bundle.tar.gz

pipelines:
  branches:
    main:
      - step: *archive
      - parallel:
          - step: *image
          - step: *bundle
  tags:
    'v*':
      - step: *archive
      - parallel:
          - step: *image
          - step: *bundle
  custom:
    docs:
      - step: *archive
      - parallel:
          - step: *image
          - step: *bundle
