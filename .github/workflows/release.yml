# Every push to master publishes a release: the next patch version after the last vX.Y.Z tag,
# starting with v0.1.0. Pushing a vX.Y.Z tag by hand releases exactly that version, which is how
# a minor or major version starts. The release carries the static binary adocs-linux-x86_64 and
# SHA256SUMS, the names DEPLOY.md refers to.
#
# Docker Hub is optional: with the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets set, the same
# image is pushed as <user>/adocs:<version> and :latest (the version without "v").

name: release

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  workflow_dispatch:

# One release at a time, so two quick pushes cannot take the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to find the last version

      - name: Next version
        id: next
        run: |
          # A pushed tag is released as is.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! printf '%s' "$GITHUB_REF_NAME" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2
              exit 1
            fi
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A commit that already has a version tag is left to the run for that tag.
          # No grep -q: with pipefail an early exit could fail the pipe and hide the match.
          if [ -n "$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$')" ]; then
            echo "HEAD is already released: $(git tag --points-at HEAD | tr '\n' ' ')"
            exit 0
          fi
          last=$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)
          if [ -z "$last" ]; then
            next=v0.1.0
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "last: ${last:-none}, next: $next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.version.outputs.tag }}
      ASSET: adocs-linux-x86_64
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The same Dockerfile as for local builds: a static musl binary inside Alpine.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: adocs:release
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Take the binary out of the image
        run: |
          mkdir dist
          cid=$(docker create adocs:release)
          docker cp "$cid:/usr/local/bin/adocs" "dist/$ASSET"
          docker rm "$cid"
          cd dist && sha256sum "$ASSET" > SHA256SUMS && cat SHA256SUMS

      # The binary starts on the runner's glibc system and answers the liveness check without an archive.
      - name: Smoke test
        run: |
          ADOCS_DATA_DIR=/tmp/none ADOCS_ARCHIVE=repo.tar.gz ADOCS_CACHE_DIR=/tmp/adocs-cache \
            APP_PORT=18080 "dist/$ASSET" &
          for i in $(seq 30); do
            curl -fsS http://127.0.0.1:18080/pub/health && exit 0
            sleep 1
          done
          echo "the binary did not answer /pub/health" >&2
          exit 1

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pushed before the release is created: a failed push leaves no tag, and a re-run takes the same version.
      - name: Push to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        run: |
          image="docker.io/$DOCKERHUB_USERNAME/adocs"
          for t in "${TAG#v}" latest; do
            docker tag adocs:release "$image:$t"
            docker push "$image:$t"
          done

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" "dist/$ASSET" dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
